<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام طلبات الطباعة</title>
<meta name="theme-color" content="#1414b0">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1414b0;--blue2:#0a0a8f;--blue3:#2b30d6;--sky:#4db5f5;--green:#36b64a;--green2:#2fa43f;
  --orange:#ffb648;--pink:#f2648a;--bg:#e8ecf8;--sheet:#f6f8fe;--card:#fff;--ink:#22264a;--muted:#9aa0bd;
  --line:#eceffa;--shadow:0 10px 28px rgba(28,36,120,.09);--err:#e0435e;--errbg:#fdecef;--ok:#22a34a;--okbg:#e8f8ec
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:16px}
button,input,textarea,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--sheet);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(20,20,120,.08)}
.hidden{display:none!important}

/* الترويسة */
.hero{position:relative;background:linear-gradient(135deg,var(--blue3) 0%,var(--blue) 45%,var(--blue2) 100%);color:#fff;padding:22px 22px 64px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:75%;height:180%;background:rgba(255,255,255,.07);transform:rotate(28deg)}
.hero::after{content:"";position:absolute;left:-60px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.icon-btn{width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}
.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;flex:none;background:linear-gradient(135deg,#ffb648,#f2648a);box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.hero h1{position:relative;z-index:1;margin:0;font-size:26px;font-weight:800}
.hero p{position:relative;z-index:1;margin:4px 0 0;font-size:13px;opacity:.75}

/* الورقة البيضاء */
.sheet{position:relative;z-index:2;margin-top:-36px;background:var(--sheet);border-radius:30px 30px 0 0;padding:24px 18px 120px;min-height:60vh}
.sheet.nonav{padding-bottom:36px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 14px;font-weight:700;font-size:15px}
.section-title small{color:var(--muted);font-weight:500}

/* البلاطات */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{background:var(--card);border:0;border-radius:20px;box-shadow:var(--shadow);padding:20px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:center;min-height:138px;justify-content:center;position:relative}
.tile:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(28,36,120,.14)}
.tile:active{transform:scale(.97)}
.tile .ill{width:64px;height:64px}
.tile .lbl{font-size:14px;color:#5c6185;font-weight:500}
.tile .cnt{position:absolute;top:10px;left:10px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--pink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.dept-ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:800;color:#fff}
.dept-ico svg{width:30px;height:30px}
.tile .sub{font-size:12px;color:var(--muted);margin-top:-6px}

/* الإحصاءات */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;gap:12px}
.stat .dot{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.stat .dot svg{width:22px;height:22px}
.stat b{display:block;font-size:22px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}

/* البحث */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 14px;margin-bottom:16px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:none;flex:1;padding:12px 0;font-size:15px}

/* بطاقات القوائم */
.list{display:flex;flex-direction:column;gap:14px}
.row{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;align-items:center;gap:14px;border:0;width:100%;text-align:right;cursor:pointer;transition:transform .15s}
.row:active{transform:scale(.98)}
.row .avatar{box-shadow:none;width:48px;height:48px;border-radius:50%;font-size:16px}
.row .body{flex:1;min-width:0}
.row .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g{color:var(--green);font-weight:700}
.row .chev{width:18px;height:18px;color:#c3c7dd;flex:none}
.medal{width:34px;height:34px;flex:none}
.req{cursor:default;flex-wrap:wrap}
.req .actions{width:100%;display:flex;gap:8px;padding-top:12px;margin-top:2px;border-top:1px dashed var(--line)}
.req .note{width:100%;font-size:13px;color:#6b7096;background:#f4f6fd;border-radius:10px;padding:8px 10px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.pill.wait{background:#fff4e1;color:#d98a00}
.pill.done{background:var(--okbg);color:var(--ok)}

/* الأزرار والحقول */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:wait}
.btn svg{width:18px;height:18px}
.btn.primary{background:linear-gradient(135deg,var(--blue3),var(--blue));color:#fff;box-shadow:0 8px 20px rgba(20,20,176,.25)}
.btn.green{background:var(--green);color:#fff;box-shadow:0 8px 20px rgba(54,182,74,.25)}
.btn.soft{background:#eef0fb;color:var(--blue)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:12px;flex:1}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--blue);font-weight:700;cursor:pointer;padding:6px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:#6b7096;font-weight:700;margin:0 4px 8px}
.input{width:100%;border:1.5px solid var(--line);background:#fafbff;border-radius:14px;padding:13px 14px;outline:0;transition:border-color .15s,background .15s}
.input:focus{border-color:var(--blue3);background:#fff}
textarea.input{min-height:84px;resize:vertical}
.who{display:flex;flex-direction:column;align-items:center;text-align:center;margin:0 auto 18px}
.who .avatar{width:84px;height:84px;border-radius:26px;font-size:28px;box-shadow:0 0 0 5px #fff,0 12px 28px rgba(28,36,120,.2)}
.who b{margin-top:12px;font-size:18px}
.who span{font-size:13px;color:var(--muted)}
.msg{display:none;padding:11px 14px;border-radius:12px;margin-top:12px;font-size:14px}
.msg.err{display:block;background:var(--errbg);color:var(--err)}
.msg.ok{display:block;background:var(--okbg);color:var(--ok)}
.hint{font-size:13px;color:var(--muted)}

.select{position:relative;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fafbff;border-radius:14px;padding:0 14px;transition:border-color .15s,background .15s}
.select:focus-within{border-color:var(--blue3);background:#fff}
.select>svg{width:20px;height:20px;color:var(--blue3);flex:none}
.select>svg.cd{color:var(--muted);width:18px;height:18px;pointer-events:none}
.select select,.select input{flex:1;min-width:0;border:0;outline:0;background:none;padding:14px 0;font-size:16px;appearance:none;-webkit-appearance:none;cursor:pointer}
.select input{cursor:text}
.select select:disabled{color:var(--muted);cursor:not-allowed}
.welcome-ill{display:flex;justify-content:center;margin:-8px 0 14px}
.ill.big{width:96px;height:96px;filter:drop-shadow(0 10px 18px rgba(28,36,120,.15))}

/* شريط اختيار الملف الأخضر */
.filebar{display:flex;align-items:center;gap:12px;background:var(--green);color:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:0 10px 22px rgba(54,182,74,.28);margin-bottom:18px;transition:background .15s}
.filebar:hover{background:var(--green2)}
.filebar svg{width:24px;height:24px;flex:none}
.filebar .fn{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.filebar .sz{font-size:12px;opacity:.85}
.filebar.drag{outline:3px dashed rgba(255,255,255,.8);outline-offset:-8px}

/* لوحة النوع البرتقالية */
.panel{border-radius:24px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}
.panel-h{background:var(--orange);color:#fff;font-weight:700;padding:14px 18px 34px;display:flex;justify-content:space-between;align-items:center}
.panel-b{background:#fff;border-radius:24px 24px 0 0;margin-top:-22px;padding:18px 14px}
.types{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.type{border:2px solid transparent;background:#fff;border-radius:16px;box-shadow:0 6px 16px rgba(28,36,120,.08);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:#5c6185;transition:border-color .15s,transform .1s}
.type svg{width:30px;height:30px}
.type.on{border-color:var(--blue3);color:var(--blue);font-weight:700}
.type:active{transform:scale(.95)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#fafbff;border:1.5px solid var(--line);border-radius:14px;padding:6px}
.stepper button{width:42px;height:42px;border:0;border-radius:11px;background:#eef0fb;color:var(--blue);font-size:22px;font-weight:700;cursor:pointer}
.stepper input{border:0;outline:0;background:none;text-align:center;font-size:22px;font-weight:800;width:90px}
.seg{display:flex;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:5px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty svg{width:70px;height:70px;opacity:.5;display:block;margin:0 auto 10px}

/* الشريط السفلي */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:76px;z-index:20;filter:drop-shadow(0 -6px 20px rgba(20,20,120,.12))}
.nav svg.shape{position:absolute;inset:0;width:100%;height:100%}
.nav .nb{position:absolute;bottom:14px;width:52px;height:46px;border:0;background:none;color:rgba(255,255,255,.6);cursor:pointer;display:grid;place-items:center}
.nav .nb svg{width:26px;height:26px}
.nav .nb.on{color:#fff}
.nav .nb.l{left:13%}
.nav .nb.r{right:13%}
.fab{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;border:6px solid var(--sheet);background:var(--sky);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 24px rgba(77,181,245,.45);transition:transform .15s}
.fab:active{transform:translateX(-50%) scale(.94)}
.fab svg{width:28px;height:28px}

.spin{width:34px;height:34px;border:4px solid #dfe3f6;border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:50;max-width:90%;box-shadow:0 10px 30px rgba(0,0,0,.2)}
</style>
</head>

/* ---------- أدوات ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function initials(n) { var p = String(n || '').trim().split(/\s+/); return (p[0] ? p[0].charAt(0) : '') + (p[1] ? p[1].charAt(0) : ''); }
function countWord(n) { return n === 1 ? 'عضو واحد' : n === 2 ? 'عضوان' : n <= 10 ? n + ' أعضاء' : n + ' عضواً'; }
function firstName(n) { return String(n || '').trim().split(/\s+/).slice(0, 2).join(' '); }
function errText(e) { return String((e && e.message) || e).replace(/^(Exception|Error):\s*/, ''); }
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  function fail(m, rej) {
    m = errText(m);
    if (m.indexOf('انتهت الجلسة') >= 0 && fn !== 'me') { logoutLocal(); toast(m); }
    rej(new Error(m));
  }
  return new Promise(function (res, rej) {
    if (window.google && google.script && google.script.run) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { fail(e, rej); });
      return r[fn].apply(r, args);
    }
    fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (x) { return x.json(); })
      .then(function (d) { d.ok ? res(d.result) : fail(d.error, rej); })
      .catch(function () { fail('تعذّر الاتصال بالخادم. تحقق من الإنترنت وحاول مرة أخرى.', rej); });
  });
}
function toast(t) { var el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.add('hidden'); }, 3200); }
function msg(id, text, ok) { var m = $(id); if (!m) return; m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); }
function busy(btn, fn) { btn.disabled = true; return Promise.resolve().then(fn).catch(function () {}).then(function () { btn.disabled = false; }); }
function store(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
function stored(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

  });
  var c = $('copies');
  on('cMinus', 'click', function () { c.value = Math.max(1, (+c.value || 1) - 1); });
  on('cPlus', 'click', function () { c.value = Math.min(2000, (+c.value || 0) + 1); });
  on('fUp', 'submit', function (e) {
    e.preventDefault();
    if (!S.file) return msg('mUp', 'اختر ملف PDF أولاً.');
    if (!S.type) return msg('mUp', 'اختر نوع الملف.');
    if (S.type === 'أخرى' && !$('oText').value.trim()) return msg('mUp', 'اكتب نوع الملف.');
    var b = $('bUp');
    busy(b, function () {
      b.innerHTML = 'جارٍ الرفع...';
      return readB64(S.file).then(function (b64) {
        return api('uploadRequest', S.token, { fileName: S.file.name, base64: b64, type: S.type, otherText: $('oText').value, copies: c.value, notes: $('notes').value });
      }).then(function (r) { toast('تم إرسال الطلب رقم ' + r.id); viewMine(); })
        .catch(function (err) { msg('mUp', err.message); b.innerHTML = IC.check + ' إرسال الطلب'; });
    });
  });
}
function pick(f) {
  if (!f) return;
  if (!(f.type === 'application/pdf' || /\.pdf$/i.test(f.name))) return msg('mUp', 'يُسمح بملفات PDF فقط.');
  if (f.size > MAX_MB * 1048576) return msg('mUp', 'حجم الملف أكبر من ' + MAX_MB + ' ميجابايت.');
  S.file = f; $('mUp').className = 'msg';
  $('fName').textContent = f.name; $('fSz').textContent = (f.size / 1048576).toFixed(1) + ' MB';
}
function readB64(f) {
  return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(f); });
}

/* ---------- طلباتي ---------- */
function viewMine() {
  render(hero({ title: 'طلباتي', sub: 'متابعة حالة طلبات الطباعة', back: true, avatar: S.me.name }) +
    '<div class="sheet"><div class="list" id="mList"><div class="spin"></div></div></div>', 'list');
  on('hBack', 'click', viewHome);
  api('listMine', S.token).then(function (list) {
    $('mList').innerHTML = list.length ? list.map(function (r) {
      var done = r.status === 'تم';
      return '<div class="row req"><div class="avatar" style="border-radius:14px;' + grad(r.type) + '">' + (TYPE_IC[r.type] || TYPE_IC['أخرى']).replace('<svg ', '<svg style="width:28px;height:28px" ') + '</div>' +
        '<div class="body"><div class="t">' + esc(r.typeLabel) + '</div><div class="s"><span class="g">' + r.copies + ' نسخة</span> · ' + esc(r.fileName) + '</div>' +
        '<div class="s">#' + esc(r.id) + ' · ' + esc(r.createdAt) + '</div></div>' +
        '<span class="pill ' + (done ? 'done' : 'wait') + '">' + esc(r.status) + '</span>' +
        (done ? '<div class="note">نُفّذ بواسطة ' + esc(r.doneBy) + ' · ' + esc(r.doneAt) + '</div>' : '') + '</div>';
    }).join('') : emptyBox('لا توجد طلبات بعد', true);
    on('eNew', 'click', viewUpload);
  }).catch(function (e) { $('mList').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
}
function emptyBox(t, btn) {
  return '<div class="empty">' + ILL.mine.replace('class="ill"', '') + t +
    (btn ? '<div style="margin-top:16px"><button class="btn primary" id="eNew">' + IC.plus + ' طلب جديد</button></div>' : '') + '</div>';
}

/* ---------- الطلبات الواردة ---------- */
var MEDAL_WAIT = '<svg class="medal" viewBox="0 0 34 34"><circle cx="17" cy="15" r="10" fill="#ffc56b" stroke="#f59f1b" stroke-width="2"/><path d="M17 10v5l3 2" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M11 23l-2 8 4-2 3 3 1-7M23 23l2 8-4-2-3 3-1-7" fill="#f2648a"/></svg>';
var MEDAL_DONE = '<svg class="medal" viewBox="0 0 34 34"><circle cx="17" cy="17" r="12" fill="#e8f8ec" stroke="#36b64a" stroke-width="2"/><path d="M11.5 17.5l4 4 7-8" stroke="#36b64a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';

function viewQueue() {
  var tech = S.me.role === 'فني';
  render(hero({ title: 'الطلبات الواردة', sub: 'نزّل الملف، اطبعه، ثم اضغط "تم"', back: !tech, menu: tech, avatar: S.me.name }) +
    '<div class="sheet"><div class="seg" id="seg">' +
    ['قيد الانتظار', 'تم', 'الكل'].map(function (s) { return '<button data-s="' + s + '" class="' + (S.filter === s ? 'on' : '') + '">' + s + '</button>'; }).join('') +
    '</div><div class="search">' + IC.search + '<input id="q" placeholder="ابحث باسم المعلم أو القسم..." autocomplete="off"></div><div class="list" id="qList"><div class="spin"></div></div></div>', 'list');
  on('hBack', 'click', viewHome); on('hOut', 'click', doLogout);
  APP.querySelectorAll('[data-s]').forEach(function (b) {
    b.onclick = function () { S.filter = b.dataset.s; APP.querySelectorAll('[data-s]').forEach(function (x) { x.classList.toggle('on', x === b); }); loadQueue(); };
  });
  on('q', 'input', function () { drawQueue(); });
  $('qList').addEventListener('click', onQueueClick);
  loadQueue();
  S.timer = setInterval(loadQueue, 60000);
}
function loadQueue() {
  return api('listQueue', S.token, S.filter).then(function (d) {
    S.q = d;
    var bs = APP.querySelectorAll('[data-s]');
    if (bs.length) { bs[0].textContent = 'قيد الانتظار (' + d.counts.wait + ')'; bs[1].textContent = 'تم (' + d.counts.done + ')'; }
    drawQueue();
  }).catch(function (e) { if ($('qList')) $('qList').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
}
function drawQueue() {
  if (!S.q || !$('qList')) return;
  var f = ($('q') && $('q').value.trim()) || '';
  var items = S.q.items.filter(function (r) { return !f || (r.name + ' ' + r.dept + ' ' + r.typeLabel).indexOf(f) >= 0; });
  $('qList').innerHTML = items.length ? items.map(function (r) {
    var done = r.status === 'تم';
    return '<div class="row req"><div class="avatar" style="' + grad(r.name) + '">' + esc(initials(r.name)) + '</div>' +
      '<div class="body"><div class="t">' + esc(r.name) + '</div>' +
      '<div class="s"><span class="g">' + r.copies + ' نسخة</span> · ' + esc(r.typeLabel) + (r.dept ? ' · ' + esc(r.dept) : '') + '</div>' +
      '<div class="s">#' + esc(r.id) + ' · ' + esc(r.createdAt) + '</div></div>' + (done ? MEDAL_DONE : MEDAL_WAIT) +
      (r.notes ? '<div class="note">📝 ' + esc(r.notes) + '</div>' : '') +
      (done ? '<div class="note">نفّذه ' + esc(r.doneBy) + ' · ' + esc(r.doneAt) + '</div>' : '') +
      '<div class="actions"><button class="btn soft sm" data-dl="' + esc(r.id) + '">' + IC.dl + ' تنزيل</button>' +
      (done ? '<button class="btn soft sm" data-undo="' + esc(r.id) + '">' + IC.undo + ' تراجع</button>'
            : '<button class="btn green sm" data-done="' + esc(r.id) + '">' + IC.check + ' تم</button>') + '</div></div>';
  }).join('') : '<div class="empty">' + ILL.queue.replace('class="ill"', '') + 'لا توجد طلبات هنا</div>';
}
function onQueueClick(e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.dl) download(b.dataset.dl, b);
  if (b.dataset.done) busy(b, function () { return api('setStatus', S.token, b.dataset.done, true).then(function () { toast('تم تسجيل الطلب كمطبوع'); return loadQueue(); }).catch(function (err) { toast(err.message); }); });
  if (b.dataset.undo) busy(b, function () { return api('setStatus', S.token, b.dataset.undo, false).then(loadQueue).catch(function (err) { toast(err.message); }); });
}
function download(id, btn) {
  busy(btn, function () {
    var old = btn.innerHTML; btn.innerHTML = 'جارٍ التنزيل...';
    return api('getFile', S.token, id).then(function (f) {
      var bin = atob(f.base64), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
      var a = document.createElement('a'); a.href = url; a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }).catch(function (err) { toast(err.message); }).then(function () { btn.innerHTML = old; });
  });
}

/* ---------- البدء ---------- */
(function start() {
  var t = stored('tk');
  if (!t) return viewDepts();
  S.token = t;
  APP.innerHTML = '<div class="spin" style="margin-top:40vh"></div>';
  api('me', t).then(function (u) { S.me = u; u.mustChange ? viewChange() : viewHome(); }).catch(function () { logoutLocal(); });
})();
</script>
</body>
