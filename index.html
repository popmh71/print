<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام طلبات الطباعة</title>
<meta name="theme-color" content="#0a2d6e">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a2d6e;--navy2:#0b3c91;--blue:#1f6fe5;--blue2:#1557c0;--sky:#e8f1ff;--bg:#eef3fb;--card:#fff;
  --ink:#16244a;--muted:#7b88a8;--line:#e2e9f5;--red:#e5484d;--green:#1f9d55;--amber:#f2a516;--purple:#7c5ce0;
  --shadow:0 4px 14px rgba(16,40,100,.07);--r:14px;--side:250px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
a{color:var(--blue)}

/* ===== الشريط العلوي ===== */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:10px 20px;color:#fff;
  background:linear-gradient(90deg,var(--navy) 0%,var(--navy2) 60%,#0f4fb8 100%);box-shadow:0 2px 12px rgba(10,30,90,.25)}
.brand-school{display:flex;align-items:center;gap:12px;min-width:0}
.emblem{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.emblem svg{width:30px;height:30px}
.brand-school .t1{font-size:12px;opacity:.85}
.brand-school .t2{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.clock{text-align:center;line-height:1.3;padding:0 16px;border-inline:1px solid rgba(255,255,255,.2)}
.clock b{font-size:17px}
.clock span{display:block;font-size:12px;opacity:.85}
.bell{position:relative;width:42px;height:42px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer}
.bell svg{width:24px;height:24px}
.bell i{position:absolute;top:-4px;left:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--navy2)}
.app-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.3px}
.app-brand svg{width:38px;height:38px}
.ham{width:42px;height:42px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;display:none;place-items:center;cursor:pointer}
.ham svg{width:24px;height:24px}

/* ===== الهيكل ===== */
.shell{display:flex;min-height:calc(100vh - 66px - 46px)}
.side{width:var(--side);flex:none;background:linear-gradient(180deg,#0b3a8c,#0a2d6e);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.side .me{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:4px 0 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.side .me .av{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.85);display:grid;place-items:center;font-weight:800;font-size:22px}
.side .me b{font-size:15px}
.side .me span{font-size:12px;opacity:.75}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#dfe8ff;padding:12px 14px;border-radius:12px;cursor:pointer;font-weight:500;text-align:right;transition:background .15s}
.nav-i svg{width:22px;height:22px;flex:none;opacity:.9}
.nav-i:hover{background:rgba(255,255,255,.08)}
.nav-i.on{background:linear-gradient(90deg,#2f86ff,#1f6fe5);color:#fff;box-shadow:0 6px 16px rgba(31,111,229,.35)}
.nav-i .cnt{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 7px}
.side .grow{flex:1}
.main{flex:1;min-width:0;padding:20px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;background:#fff;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.foot b{color:var(--ink)}
.scrim{display:none}

/* ===== مكونات ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.head-row{display:flex;gap:16px;align-items:stretch;margin-bottom:16px;flex-wrap:wrap}
.school-card{flex:1;min-width:260px;display:flex;align-items:center;gap:14px;padding:14px 18px}
.school-card .ic{width:56px;height:56px;flex:none}
.school-card b{font-size:19px;font-weight:800;display:block}
.school-card span{font-size:13px;color:var(--muted)}
.hello{display:flex;align-items:center;gap:12px;padding:12px 16px;min-width:230px}
.hello .av{width:46px;height:46px;border-radius:50%;background:var(--navy2);color:#fff;display:grid;place-items:center;font-weight:800}
.hello small{display:block;color:var(--muted);font-size:12px}
.hello b{font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px 12px;cursor:pointer;text-align:center;border:1px solid var(--line);transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(16,40,100,.12);border-color:#cfe0fb}
.tile svg{width:64px;height:64px}
.tile b{font-size:17px;font-weight:800}
.tile span{font-size:13px;color:var(--muted)}
.tile .badge{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;border-radius:12px;font-size:12px;font-weight:700;padding:2px 9px;font-style:normal}
.panels{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.panel{padding:16px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel-h svg{width:24px;height:24px;color:var(--blue)}
.panel-h b{font-size:16px;font-weight:800}
.panel-h .more{margin-inline-start:auto;border:0;background:none;color:var(--blue);cursor:pointer;font-weight:500}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{background:#eaf1fd;color:#3b4a6b;font-weight:700;padding:10px;text-align:right;white-space:nowrap}
.tbl th:first-child{border-radius:0 10px 10px 0}.tbl th:last-child{border-radius:10px 0 0 10px}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:800;background:#f6f9ff;border-top:2px solid var(--line)}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.qstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.qs{border-radius:12px;padding:12px 8px;text-align:center;border:1px solid}
.qs svg{width:24px;height:24px}
.qs span{display:block;font-size:12px;color:#55607e;margin:2px 0}
.qs b{font-size:24px;font-weight:800}
.qs.p{background:#f3effd;border-color:#ded3fb;color:var(--purple)}
.qs.b{background:#eaf2ff;border-color:#cfe0fb;color:var(--blue)}
.qs.g{background:#e9f8ef;border-color:#c7ecd6;color:var(--green)}
.notes{list-style:none;margin:0;padding:0}
.notes li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.notes li:last-child{border-bottom:0}
.notes .ni{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.notes .ni svg{width:20px;height:20px}
.notes .tx{flex:1;min-width:0;font-size:14px}
.notes .tx small{display:block;color:var(--muted);font-size:12px}
.notes .dt{font-size:12px;color:var(--muted);white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.wait{background:#fff4e1;color:#c27a00}
.pill.done{background:#e6f6ec;color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}

/* صفحات داخلية */
.page-h{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-h .ic{width:52px;height:52px;flex:none}
.page-h .ic svg{width:52px;height:52px}
.page-h b{font-size:21px;font-weight:800;display:block}
.page-h span{font-size:13px;color:var(--muted)}
.page-h .act{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .1s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:wait}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(31,111,229,.25)}
.btn.pri:hover{background:var(--blue2)}
.btn.ok{background:var(--green);color:#fff}
.btn.soft{background:#eaf1fd;color:var(--blue2)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.link{border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer;padding:6px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;color:#4a5778;font-weight:700;margin:0 2px 7px}
.ctl{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#f8fbff;border-radius:12px;padding:0 12px;transition:border-color .15s,background .15s}
.ctl:focus-within{border-color:var(--blue);background:#fff}
.ctl>svg{width:20px;height:20px;color:var(--blue);flex:none}
.ctl select,.ctl input,.ctl textarea{flex:1;min-width:0;border:0;outline:0;background:none;padding:12px 0;font-size:16px}
.ctl select{appearance:none;-webkit-appearance:none;cursor:pointer}
.ctl textarea{min-height:80px;resize:vertical}
.ctl .cd{width:16px;height:16px;color:var(--muted);pointer-events:none}
.msg{display:none;padding:10px 12px;border-radius:10px;margin-top:12px;font-size:14px}
.msg.err{display:block;background:#fdecee;color:#c02a35}
.msg.ok{display:block;background:#e6f6ec;color:var(--green)}
.hint{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--navy2);color:#fff}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .ctl{flex:1;min-width:200px;background:#fff}

/* الدخول */
.login-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;max-width:960px;margin:24px auto;align-items:center}
.login-art{text-align:center;padding:10px}
.login-art svg{width:100%;max-width:340px;height:auto}
.login-art b{display:block;font-size:24px;font-weight:800;margin-top:10px}
.login-art span{color:var(--muted)}
.login-card{padding:26px}
.login-card h2{margin:0 0 4px;font-size:22px}
.login-card p.sub{margin:0 0 18px;color:var(--muted);font-size:14px}

/* رفع الملف */
.up-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.drop{border:2px dashed #bcd2f5;background:#f5f9ff;border-radius:14px;padding:26px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover,.drop.drag{background:#eaf2ff;border-color:var(--blue)}
.drop svg{width:56px;height:56px}
.drop b{display:block;margin-top:8px}
.drop.has{border-style:solid;border-color:var(--green);background:#eefaf3}
.types{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.type{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:500;color:#4a5778;transition:border-color .15s}
.type svg{width:34px;height:34px}
.type.on{border-color:var(--blue);background:#f0f6ff;color:var(--blue2);font-weight:800}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);background:#f8fbff;border-radius:12px;padding:5px}
.stepper button{width:44px;height:44px;border:0;border-radius:10px;background:#eaf1fd;color:var(--blue2);font-size:22px;font-weight:800;cursor:pointer}
.stepper input{border:0;outline:0;background:none;text-align:center;font-size:24px;font-weight:800;width:100px}

/* التقارير */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{display:flex;align-items:center;gap:12px;padding:16px}
.kpi .ki{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;flex:none}
.kpi .ki svg{width:26px;height:26px}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.bar{height:8px;background:#edf2fb;border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4f93ff,#1f6fe5);border-radius:4px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--blue2);border-bottom-color:var(--blue)}
.tbl-wrap{overflow-x:auto}

.spin{width:32px;height:32px;border:4px solid #dbe5f6;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .2s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:80;max-width:90%;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* ===== الهاتف ===== */
@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .ham{display:grid}
  .clock{display:none}
  .side{position:fixed;top:0;bottom:0;right:0;z-index:60;transform:translateX(105%);transition:transform .25s;overflow-y:auto}
  .side.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.3)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,20,50,.45);z-index:55}
  .panels,.up-grid,.login-wrap{grid-template-columns:1fr}
  .login-art{display:none}
  .main{padding:14px}
}
@media (max-width:600px){
  .top{padding:8px 12px;gap:10px}
  .brand-school .t1{display:none}
  .brand-school .t2{font-size:14px}
  .emblem{width:38px;height:38px}
  .app-brand span{display:none}
  .tiles{grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{padding:16px 8px}
  .tile svg{width:52px;height:52px}
  .tile b{font-size:15px}
  .types{grid-template-columns:repeat(3,1fr)}
  .kpi b{font-size:22px}
  .foot{flex-direction:column;text-align:center}
  .hello{min-width:0;flex:1}
  .school-card{display:none}
  .head-row{margin-bottom:12px}
}
@media print{
  .top,.side,.foot,.page-h .act,.toolbar,.tabs,.seg{display:none!important}
  .main{padding:0}.card{box-shadow:none}
  body{background:#fff}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand-school">
    <div class="emblem"><svg viewBox="0 0 32 32" fill="none"><path d="M16 4L3 10l13 6 13-6z" fill="#fff"/><path d="M8 13v6c0 2.5 3.6 4.5 8 4.5s8-2 8-4.5v-6l-8 3.7z" fill="#9cc3ff"/><path d="M27 11v8" stroke="#ffcf5a" stroke-width="2" stroke-linecap="round"/><circle cx="27" cy="20.5" r="1.8" fill="#ffcf5a"/></svg></div>
    <div><div class="t1" id="ministry"></div><div class="t2" id="school"></div></div>
  </div>
  <div class="sp"></div>
  <div class="clock"><b id="clkT">--:--</b><span id="clkD"></span></div>
  <button class="bell hidden" id="bell" title="الإشعارات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></svg><i class="hidden" id="bellN"></i></button>
  <div class="app-brand"><svg viewBox="0 0 40 40" fill="none"><rect x="9" y="4" width="22" height="11" rx="2" fill="#fff"/><rect x="3" y="13" width="34" height="16" rx="4" fill="#9cc3ff"/><rect x="10" y="23" width="20" height="13" rx="2" fill="#fff"/><path d="M14 28h12M14 32h8" stroke="#1f6fe5" stroke-width="2" stroke-linecap="round"/><circle cx="31" cy="18" r="1.8" fill="#38d07a"/></svg><span>نظام الطباعة</span></div>
  <button class="ham hidden" id="ham" title="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>
<div class="shell">
  <aside class="side hidden" id="side"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
</div>
<footer class="foot"><span id="footL"></span><b>معاً نحو تعليم أفضل</b></footer>
<div class="toast hidden" id="toast"></div>

<script>
var APP_NAME = "نظام طلبات الطباعة";
var SCHOOL_NAME = "مدرسة الفاتح الثانوية للبنين";
var MINISTRY_NAME = "وزارة التربية والتعليم - مملكة البحرين";
var FILE_TYPES = ["نشاط", "امتحانات", "أوراق توثيق", "درجات", "أخرى"];
var MAX_MB = 25;
var API_URL = 'https://script.google.com/macros/s/AKfycbwuE-pb-uYeJpyOnYwPa6zB9X7saJx1AYsDa-eXBgQw4MRMtQm-L_Ea1Es1VSGHsuDA/exec';

var S = { token: null, me: null, dir: null, dept: '', name: '', file: null, type: null, filter: 'قيد الانتظار', timer: null, view: '', rp: 'month', rtab: 'dept' };
var $ = function (id) { return document.getElementById(id); };
var MAIN = $('main');

/* ---------- أيقونات خطية ---------- */
var I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 3h7l5 5v12a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M12 11v6M9 14h6"/></svg>',
  mine: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>',
  queue: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"/><rect x="5" y="11" width="3" height="7" rx="1"/><rect x="10.5" y="6" width="3" height="12" rx="1"/><rect x="16" y="9" width="3" height="9" rx="1"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>',

/* ---------- أدوات ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function initials(n) { var p = String(n || '').trim().split(/\s+/); return (p[0] ? p[0].charAt(0) : '') + (p[1] ? p[1].charAt(0) : ''); }
function firstName(n) { return String(n || '').trim().split(/\s+/).slice(0, 2).join(' '); }
function fmtN(n) { return Number(n || 0).toLocaleString('en-US'); }
function errText(e) { return String((e && e.message) || e).replace(/^(Exception|Error):\s*/, ''); }
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  function fail(m, rej) {
    m = errText(m);
    if (m.indexOf('انتهت الجلسة') >= 0 && fn !== 'me') { logoutLocal(); toast(m); }
    rej(new Error(m));
  }
  return new Promise(function (res, rej) {
    if (window.google && google.script && google.script.run) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { fail(e, rej); });
      return r[fn].apply(r, args);
    }
    fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (x) { return x.json(); })
      .then(function (d) { d.ok ? res(d.result) : fail(d.error, rej); })
      .catch(function () { fail('تعذّر الاتصال بالخادم. تحقق من الإنترنت وحاول مرة أخرى.', rej); });
  });
}
function toast(t) { var el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.add('hidden'); }, 3200); }
function msg(id, text, ok) { var m = $(id); if (!m) return; m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); }
function busy(btn, fn) { btn.disabled = true; return Promise.resolve().then(fn).catch(function () {}).then(function () { btn.disabled = false; }); }
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function stored(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function on(id, ev, fn) { var el = $(id); if (el) el.addEventListener(ev, fn); }

function viewUpload() {
  S.file = null; S.type = null;
  page('upload', pageHead(A.upload, 'طلب طباعة جديد', 'ارفع ملف PDF وحدد نوعه وعدد النسخ') +
    '<form id="fUp"><div class="up-grid"><div class="card panel">' +
    '<div class="drop" id="drop">' + A.upload + '<b id="fName">اضغط لاختيار ملف PDF أو اسحبه هنا</b><span class="hint" id="fSz">الحد الأقصى ' + MAX_MB + ' ميجابايت</span></div>' +
    '<input type="file" id="fIn" accept="application/pdf,.pdf" class="hidden">' +
    '<div class="field" style="margin-top:16px"><label>نوع الملف</label><div class="types">' +
    FILE_TYPES.map(function (t) { return '<button type="button" class="type" data-ty="' + esc(t) + '">' + (TYPE_A[t] || TYPE_A['أخرى']) + '<span>' + esc(t) + '</span></button>'; }).join('') + '</div></div>' +
    '<div class="field hidden" id="oWrap"><div class="ctl"><input id="oText" maxlength="200" placeholder="اكتب نوع الملف..."></div></div></div>' +
    '<div class="card panel"><div class="field"><label>عدد النسخ</label><div class="stepper"><button type="button" id="cMinus">−</button><input id="copies" type="number" min="1" max="2000" value="1" inputmode="numeric"><button type="button" id="cPlus">+</button></div></div>' +
    '<div class="field"><label for="notes">ملاحظات للفني (اختياري)</label><div class="ctl"><textarea id="notes" maxlength="500" placeholder="مثال: وجهين، تدبيس، حجم A3..."></textarea></div></div>' +
    '<button class="btn ok block" id="bUp">' + I.check + ' إرسال الطلب</button><div id="mUp" class="msg"></div></div></div></form>');
  var drop = $('drop'), inp = $('fIn');
  drop.onclick = function () { inp.click(); };
  inp.onchange = function () { pick(inp.files[0]); };
  ['dragover', 'dragenter'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('drag'); }); });
  drop.addEventListener('dragleave', function () { drop.classList.remove('drag'); });
  drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('drag'); pick(e.dataTransfer.files[0]); });
  MAIN.querySelectorAll('[data-ty]').forEach(function (b) {
    b.onclick = function () {
      S.type = b.dataset.ty;
      MAIN.querySelectorAll('[data-ty]').forEach(function (x) { x.classList.toggle('on', x === b); });
      $('oWrap').classList.toggle('hidden', S.type !== 'أخرى');
      if (S.type === 'أخرى') $('oText').focus();
    };
  });
  var c = $('copies');
  on('cMinus', 'click', function () { c.value = Math.max(1, (+c.value || 1) - 1); });
  on('cPlus', 'click', function () { c.value = Math.min(2000, (+c.value || 0) + 1); });
  on('fUp', 'submit', function (e) {
    e.preventDefault();
    if (!S.file) return msg('mUp', 'اختر ملف PDF أولاً.');
    if (!S.type) return msg('mUp', 'اختر نوع الملف.');
    if (S.type === 'أخرى' && !$('oText').value.trim()) return msg('mUp', 'اكتب نوع الملف.');
    var b = $('bUp');
    busy(b, function () {
      b.innerHTML = 'جارٍ الرفع...';
      return readB64(S.file).then(function (b64) {
        return api('uploadRequest', S.token, { fileName: S.file.name, base64: b64, type: S.type, otherText: $('oText').value, copies: c.value, notes: $('notes').value });
      }).then(function (r) { toast('تم إرسال الطلب رقم ' + r.id); viewMine(); })
        .catch(function (err) { msg('mUp', err.message); b.innerHTML = I.check + ' إرسال الطلب'; });
    });
  });
}
function pick(f) {
  if (!f) return;
  if (!(f.type === 'application/pdf' || /\.pdf$/i.test(f.name))) return msg('mUp', 'يُسمح بملفات PDF فقط.');
  if (f.size > MAX_MB * 1048576) return msg('mUp', 'حجم الملف أكبر من ' + MAX_MB + ' ميجابايت.');
  S.file = f; $('mUp').className = 'msg';
  $('drop').classList.add('has');
  $('fName').textContent = f.name; $('fSz').textContent = (f.size / 1048576).toFixed(1) + ' MB — اضغط للتغيير';
}
function readB64(f) {
  return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(f); });
}

    '<div class="toolbar"><div class="seg" id="seg">' + ['قيد الانتظار', 'تم', 'الكل'].map(function (s) { return '<button data-s="' + s + '" class="' + (S.filter === s ? 'on' : '') + '">' + s + '</button>'; }).join('') + '</div>' +

function loadQueue() {
  return api('listQueue', S.token, S.filter).then(function (d) {
    S.q = d;
    var bs = MAIN.querySelectorAll('[data-s]');
    if (bs.length) { bs[0].textContent = 'قيد الانتظار (' + d.counts.wait + ')'; bs[1].textContent = 'تم (' + d.counts.done + ')'; }
    drawQueue();
  }).catch(function (e) { if ($('qList')) $('qList').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
}
function drawQueue() {
  if (!S.q || !$('qList')) return;
  var f = ($('q') && $('q').value.trim()) || '';
  var items = S.q.items.filter(function (r) { return !f || (r.name + ' ' + r.dept + ' ' + r.typeLabel).indexOf(f) >= 0; });
  $('qList').innerHTML = items.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>المعلم</th><th>القسم</th><th>النوع</th><th>النسخ</th><th>ملاحظات</th><th>التاريخ</th><th>الحالة</th><th></th></tr></thead><tbody>' +
    items.map(function (r) {
      var done = r.status === 'تم';
      return '<tr><td class="hint">' + esc(r.id) + '</td><td><b>' + esc(firstName(r.name)) + '</b></td><td class="hint">' + esc(r.dept) + '</td><td>' + esc(r.typeLabel) + '</td><td class="num" style="font-size:16px">' + fmtN(r.copies) + '</td>' +
        '<td class="hint" style="max-width:180px">' + esc(r.notes || '—') + '</td><td class="hint">' + esc(r.createdAt.slice(5)) + '</td><td>' + pill(r.status) + (done ? '<div class="hint" style="font-size:11px">' + esc(firstName(r.doneBy)) + '</div>' : '') + '</td>' +
        '<td style="white-space:nowrap"><button class="btn soft sm" data-dl="' + esc(r.id) + '">' + I.dl + ' تنزيل</button> ' +
        (done ? '<button class="btn line sm" data-undo="' + esc(r.id) + '">' + I.undo + ' تراجع</button>' : '<button class="btn ok sm" data-done="' + esc(r.id) + '">' + I.check + ' تم</button>') + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="empty">لا توجد طلبات هنا</div>';
}
function onQueueClick(e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.dl) download(b.dataset.dl, b);
  if (b.dataset.done) busy(b, function () { return api('setStatus', S.token, b.dataset.done, true).then(function () { toast('تم تسجيل الطلب كمطبوع'); refreshBadges(); return loadQueue(); }).catch(function (err) { toast(err.message); }); });
  if (b.dataset.undo) busy(b, function () { return api('setStatus', S.token, b.dataset.undo, false).then(function () { refreshBadges(); return loadQueue(); }).catch(function (err) { toast(err.message); }); });
}
function download(id, btn) {
  busy(btn, function () {
    var old = btn.innerHTML; btn.innerHTML = '...';
    return api('getFile', S.token, id).then(function (f) {
      var bin = atob(f.base64), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
      var a = document.createElement('a'); a.href = url; a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }).catch(function (err) { toast(err.message); }).then(function () { btn.innerHTML = old; });
  });
}

    '<button class="btn line" id="rCsv">' + I.excel + ' تصدير Excel</button><button class="btn line" id="rPrint">' + I.print + ' طباعة</button>') +
    '<div class="toolbar"><div class="seg" id="rSeg">' + PERIODS.map(function (p) { return '<button data-p="' + p[0] + '" class="' + (S.rp === p[0] ? 'on' : '') + '">' + p[1] + '</button>'; }).join('') + '</div></div>' +
    '<div class="kpis" id="kpis"></div>' +
    '<div class="card panel"><div class="tabs" id="rTabs"><button data-r="dept">حسب القسم</button><button data-r="teacher">حسب المعلم</button><button data-r="type">حسب نوع الملف</button></div>' +
    '<div class="toolbar hidden" id="rFilt"><div class="ctl">' + I.search + '<input id="rq" placeholder="ابحث باسم المعلم..."></div><div class="ctl" style="flex:0 1 240px">' + I.dept + '<select id="rDept"><option value="">كل الأقسام</option></select>' + I.cd + '</div></div>' +
    '<div id="rBody"><div class="spin"></div></div></div>');
  MAIN.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { S.rp = b.dataset.p; MAIN.querySelectorAll('[data-p]').forEach(function (x) { x.classList.toggle('on', x === b); }); loadReport(); }; });
  MAIN.querySelectorAll('[data-r]').forEach(function (b) { b.onclick = function () { S.rtab = b.dataset.r; drawReport(); }; });
  on('rq', 'input', drawReport); on('rDept', 'change', drawReport);
  on('rPrint', 'click', function () { window.print(); });
  on('rCsv', 'click', exportCsv);
  loadReport();
}
function loadReport() {
  $('rBody').innerHTML = '<div class="spin"></div>';
  api('report', S.token, S.rp).then(function (r) {
    if (!$('kpis')) return;
    S.rep = r;
    var t = r.totals;
    $('kpis').innerHTML = kpi('#e8f1ff', '#1f6fe5', I.copies, fmtN(t.done), 'نسخة مطبوعة (الإجمالي)') +
      kpi('#fff6e5', '#c98200', I.clock, fmtN(t.wait), 'نسخة بانتظار الطباعة') +
      kpi('#f3effd', '#7c5ce0', I.mine, fmtN(t.requests), 'عدد الطلبات') +
      kpi('#e9f8ef', '#1f9d55', I.team, fmtN(t.teachers) + ' <small style="font-size:14px;color:var(--muted)">/ ' + fmtN(t.depts) + ' قسم</small>', 'معلم استخدم الطباعة');
    var sel = $('rDept'), cur = sel.value;
    sel.innerHTML = '<option value="">كل الأقسام</option>' + r.byDept.map(function (d) { return '<option' + (d.dept === cur ? ' selected' : '') + '>' + esc(d.dept) + '</option>'; }).join('');
    drawReport();
  }).catch(function (e) { if ($('rBody')) $('rBody').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
}
function kpi(bg, fg, ic, n, l) { return '<div class="card kpi"><div class="ki" style="background:' + bg + ';color:' + fg + '">' + ic + '</div><div><b>' + n + '</b><span>' + l + '</span></div></div>'; }
function reportRows() {
  var r = S.rep; if (!r) return { label: '', rows: [] };
  if (S.rtab === 'teacher') {
    var q = ($('rq') && $('rq').value.trim()) || '', d = ($('rDept') && $('rDept').value) || '';
    return { label: 'المعلم', rows: r.byTeacher.filter(function (x) { return (!q || x.name.indexOf(q) >= 0) && (!d || x.dept === d); }).map(function (x) { return { k: x.name, sub: x.dept, o: x }; }) };
  }
  if (S.rtab === 'type') return { label: 'نوع الملف', rows: r.byType.map(function (x) { return { k: x.type, o: x }; }) };
  return { label: 'القسم', rows: r.byDept.map(function (x) { return { k: x.dept, o: x }; }) };
}
function drawReport() {
  if (!S.rep || !$('rBody')) return;
  MAIN.querySelectorAll('[data-r]').forEach(function (x) { x.classList.toggle('on', x.dataset.r === S.rtab); });
  $('rFilt').classList.toggle('hidden', S.rtab !== 'teacher');
  var d = reportRows(), rows = d.rows;
  if (!rows.length) { $('rBody').innerHTML = '<div class="empty">لا توجد طلبات في هذه الفترة</div>'; return; }
  var max = Math.max.apply(null, rows.map(function (x) { return x.o.copies; })) || 1;
  var sum = rows.reduce(function (a, x) { a.req += x.o.requests; a.done += x.o.done; a.wait += x.o.wait; a.all += x.o.copies; return a; }, { req: 0, done: 0, wait: 0, all: 0 });
  var schoolAll = S.rep.totals.copies || 1;
  $('rBody').innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>' + d.label + '</th>' + (S.rtab === 'teacher' ? '<th>القسم</th>' : '') + '<th>الطلبات</th><th>نسخ مطبوعة</th><th>بالانتظار</th><th>إجمالي النسخ</th><th>النسبة من المدرسة</th></tr></thead><tbody>' +
    rows.map(function (x, i) {
      var o = x.o, pct = Math.round(o.copies * 1000 / schoolAll) / 10;
      return '<tr><td class="hint">' + (i + 1) + '</td><td><b>' + esc(x.k) + '</b></td>' + (S.rtab === 'teacher' ? '<td class="hint">' + esc(x.sub) + '</td>' : '') +
        '<td class="num">' + fmtN(o.requests) + '</td><td class="num" style="color:var(--green)">' + fmtN(o.done) + '</td><td class="num" style="color:#c27a00">' + fmtN(o.wait) + '</td><td class="num" style="font-size:16px">' + fmtN(o.copies) + '</td>' +
        '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:' + Math.max(2, o.copies * 100 / max) + '%"></i></div><span class="hint num" style="min-width:42px">' + pct + '%</span></div></td></tr>';
    }).join('') + '</tbody><tfoot><tr><td></td><td>الإجمالي</td>' + (S.rtab === 'teacher' ? '<td></td>' : '') + '<td class="num">' + fmtN(sum.req) + '</td><td class="num">' + fmtN(sum.done) + '</td><td class="num">' + fmtN(sum.wait) + '</td><td class="num">' + fmtN(sum.all) + '</td><td></td></tr></tfoot></table></div>' +
    '<p class="hint" style="margin:10px 2px 0">آخر تحديث: ' + esc(S.rep.generatedAt) + ' · "النسخ" = عدد النسخ المطلوبة في كل طلب.</p>';
}
function exportCsv() {
  if (!S.rep) return;
  var d = reportRows(), per = (PERIODS.find(function (p) { return p[0] === S.rp; }) || ['', ''])[1];
  var lines = [[SCHOOL_NAME], ['تقرير الطباعة - ' + d.label + ' - ' + per], []];
  lines.push([d.label].concat(S.rtab === 'teacher' ? ['القسم'] : []).concat(['الطلبات', 'نسخ مطبوعة', 'بالانتظار', 'إجمالي النسخ']));
  d.rows.forEach(function (x) { lines.push([x.k].concat(S.rtab === 'teacher' ? [x.sub] : []).concat([x.o.requests, x.o.done, x.o.wait, x.o.copies])); });
  var t = S.rep.totals;
  lines.push([]); lines.push(['إجمالي المدرسة'].concat(S.rtab === 'teacher' ? [''] : []).concat([t.requests, t.done, t.wait, t.copies]));
  var csv = '﻿' + lines.map(function (l) { return l.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
  var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  var a = document.createElement('a'); a.href = url; a.download = 'تقرير-الطباعة-' + d.label + '-' + per + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
}

/* ---------- البدء ---------- */
(function start() {
  var t = stored('tk');
  if (!t) return viewLogin();
  S.token = t;
  MAIN.innerHTML = '<div class="spin" style="margin-top:20vh"></div>';
  api('me', t).then(function (u) { S.me = u; u.mustChange ? viewChange() : viewHome(); }).catch(function () { logoutLocal(); });
})();
</script>
</body>
